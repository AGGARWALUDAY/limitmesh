services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: limitmesh-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    restart: unless-stopped

  redis:
    image: redis:8.10.2

    volumes:
      - redis_data:/data

    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped

  app1:
    build: .
    image: limitmesh:local

    environment:
      REDIS_URL: redis://redis:6379

    expose:
      - "3000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped
  app2:
    build: .
    image: limitmesh:local
    environment:
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: limitmesh-grafana

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  redis_data:
